name: Bug Fix Template
description: 버그 수정 템플릿
title: "🐛 [Bug]: "
labels: ["🐛 Bug"]

body:
  - type: dropdown
    id: bug-type
    attributes:
      label: "✅ 버그 종류"
      description: "발생한 버그의 종류를 선택하세요."
      options:
        - "회원/인증"
        - "운동"
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: "🐞 버그 설명"
      description: "어떤 문제가 발생했는지 설명해주세요."
      placeholder: |
        ex)
        - 로그인 요청 시 500 에러가 발생합니다.
        - 존재하지 않는 카페 ID로 조회하면 예외 응답이 제대로 반환되지 않습니다.
        - 특정 조건에서 리뷰 이미지가 저장되지 않습니다.
    validations:
      required: true

  - type: textarea
    id: bug-reproduction
    attributes:
      label: "🔁 재현 방법"
      description: "버그를 재현할 수 있는 과정을 순서대로 적어주세요."
      placeholder: |
        ex)
        1. /api/v1/members/login으로 로그인 요청
        2. 잘못된 비밀번호 입력
        3. 응답 상태 코드 확인
        4. 401이 아닌 500 에러 발생
    validations:
      required: false

  - type: textarea
    id: expected-result
    attributes:
      label: "✅ 기대 동작"
      description: "정상적으로는 어떻게 동작해야 하는지 적어주세요."
      placeholder: |
        ex)
        - 잘못된 비밀번호 입력 시 401 Unauthorized 응답이 반환되어야 합니다.
    validations:
      required: false

  - type: textarea
    id: actual-result
    attributes:
      label: "❌ 실제 동작"
      description: "현재 실제로 어떤 결과가 발생하는지 적어주세요."
      placeholder: |
        ex)
        - 500 Internal Server Error가 반환됩니다.
        - 서버 로그에 NullPointerException이 발생합니다.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: "📎 참고 자료"
      description: "스크린샷, 로그, 에러 메시지, 관련 API 등을 첨부해주세요."
      placeholder: |
        ex)
        - 에러 로그
        - 요청/응답 예시
        - 스크린샷
        - 관련 이슈 번호
    validations:
      required: false