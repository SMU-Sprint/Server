name: Refactor Template
description: 코드 구조 개선 및 리팩터링 템플릿
title: "♻️ [Refactor]: "
labels: ["♻️ Refactor"]

body:

  - type: dropdown
    id: refactor-type
    attributes:
      label: "✅ 리팩터링 종류"
      description: "리팩터링할 영역을 선택하세요."
      options:
        - "회원/인증"
        - "운동"
        - "공공 체육시설"
        - "공통/전역"
        - "기타"
    validations:
      required: true

  - type: textarea
    id: refactor-detail
    attributes:
      label: "👀 자세한 내용 (Optional)"
      description: "리팩터링할 내용과 변경 사항을 자세히 적어주세요."
      placeholder: |
        ex)
        - 중복된 회원 조회 로직을 공통 메서드로 분리
        - 예외 처리 로직 개선
        - 불필요한 코드 및 의존성 제거
    validations:
      required: false
